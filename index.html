<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sala 3 — Citas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h2>Sala 3 — Crear/Editar Cita</h2>

    <form id="citaForm">
      <label>
        Inicio (hora local del navegador):
        <input type="datetime-local" id="startLocal" required />
      </label>

      <label>
        Fin (hora local del navegador):
        <input type="datetime-local" id="endLocal" required />
      </label>

      <button type="submit">Guardar cita</button>
    </form>

    <div id="errors" class="errors"></div>

    <div id="result" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
